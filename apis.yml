aid: glimpse
name: Glimpse
description: >-
  Glimpse (legally Dime Campus, Inc.) is an AI-native retail finance platform
  that automates deductions management, revenue recovery, and cash application
  for consumer brands and CPG companies. Its AI agents are trained on billions
  of dollars in retail transactions to track, validate, and dispute invalid
  deductions, recover trapped cashflow, and match payments faster across
  retailer accounts. Glimpse reports a 91% dispute win rate, $200M+ in
  transactions processed, and 100+ hours saved monthly per finance team, and
  works alongside major retailers including Walmart, Target, Kroger, Walgreens,
  and Amazon. The San Francisco company serves 200+ consumer brands, raised a
  $35M Series A, and is backed by 8vc. It is currently an enterprise, contact-
  sales SaaS with no public self-service API or developer portal.
